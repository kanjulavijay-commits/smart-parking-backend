name: Backend CI/CD

# Trigger this workflow on every push to main branch
# Also triggers on pull requests so we catch bugs before merging
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Run Tests ─────────────────────────────────────────
  test:
    name: Run Django Tests
    runs-on: ubuntu-latest

    # Spin up a PostgreSQL container just for testing
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_smart_parking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until postgres is actually ready before running tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Download your code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"   # Cache pip packages → faster builds

      # Step 3: Install all dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run Django's built-in test suite
      # We use a test-specific SQLite DB to keep tests fast and isolated
      - name: Run tests
        env:
          SECRET_KEY: "ci-test-secret-key-not-real"
          DEBUG: "True"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_smart_parking"
        run: python manage.py test --verbosity=2

  # ── Job 2: Deploy to Railway ─────────────────────────────────
  # Only runs after tests pass AND only on pushes to main (not PRs)
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test   # This ensures deploy only happens if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Railway CLI tool
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploy to Railway using your secret token
      # RAILWAY_TOKEN is stored in GitHub Secrets (we'll set this up)
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service smart-parking-backend
